---
layout: default
title: Notes
---

<section class="card">
  <h2><i class="fa-solid fa-book section-icon"></i> Learning Notes</h2>
  <ul class="notes-list">
    {% for post in site.posts %}
    <li>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      <span class="meta">{{ post.date | date: "%Y-%m-%d" }}</span>
      {% if post.categories %}<span class="tags">{{ post.categories | join: ", " }}</span>{% endif %}
    </li>
    {% endfor %}
  </ul>
</section>
