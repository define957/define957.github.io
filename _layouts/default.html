<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}?v=8">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <button id="theme-toggle" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button>

  <header class="hero">
    <h1>{{ site.title }}</h1>
    <p class="tagline">{{ site.description }}</p>
    <div class="links">
      <a href="{{ '/' | relative_url }}"><i class="fa-solid fa-house"></i> Home</a>
      <a href="{{ '/notes/' | relative_url }}"><i class="fa-solid fa-book"></i> Notes</a>
      <a href="https://github.com/define957" target="_blank"><i class="fa-brands fa-github"></i> GitHub</a>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer>
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.author | default: site.title }}. Powered by GitHub Pages.</p>
  </footer>

  <script>
    (function() {
      const toggle = document.getElementById('theme-toggle');
      const html = document.documentElement;
      const icon = toggle.querySelector('i');
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      let isDark = saved ? saved === 'dark' : prefersDark;

      function setTheme(dark) {
        html.setAttribute('data-theme', dark ? 'dark' : 'light');
        icon.className = dark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        localStorage.setItem('theme', dark ? 'dark' : 'light');
      }

      setTheme(isDark);

      toggle.addEventListener('click', function() {
        setTheme(html.getAttribute('data-theme') !== 'dark');
      });
    })();
  </script>
</body>
</html>
